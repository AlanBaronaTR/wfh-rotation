function buildSuggestion(from){
  var next=from+1,act=activeMembers(next),cur=getSched(from),nhd=getHols(next).map(function(h){return h.day;}),ns={};
  MEMBERS.forEach(function(m){ns[m.id]=Array(5).fill('off');});
  // alwaysOffice members stay office (no WFH)
  var rotatable=act.filter(function(m){return!m.alwaysOffice;});
  var alwaysOfficeMems=act.filter(function(m){return m.alwaysOffice;});
  // Count desks used by alwaysOffice members per day
  var desksUsed=Array(5).fill(0);
  for(var d0=0;d0<5;d0++){alwaysOfficeMems.forEach(function(m){if(!isPreJoin(m.id,next,d0)&&!nhd.includes(d0))desksUsed[d0]++;});}
  var maxInOffice=Array(5).fill(0);for(var d1=0;d1<5;d1++){maxInOffice[d1]=Math.max(0,DESKS-desksUsed[d1]);}

  var wfhTarget=2;
  rotatable.forEach(function(m){
    var cw=[];for(var d=0;d<5;d++){if(memberInWeek(m.id,from)&&cur[m.id]&&cur[m.id][d]==='wfh')cw.push(d);}

    var dayCounts=Array(5).fill(0);

    dayCounts.forEach(function(c,d){if(c>=2)fb.add(d);});
    var cands=[0,1,2,3,4].filter(function(d){return!fb.has(d)&&!nhd.includes(d)&&!isPreJoin(m.id,next,d);});
    var chosen=[...cands].sort(function(){return Math.random()-0.5;}).slice(0,Math.min(n2,cands.length));
    if(chosen.length<n2){var fl=[0,1,2,3,4].filter(function(d){return!nhd.includes(d)&&!chosen.includes(d)&&!isPreJoin(m.id,next,d);});chosen.push(...fl.sort(function(){return Math.random()-0.5;}).slice(0,n2-chosen.length));}
    chosen.forEach(function(d){ns[m.id][d]='wfh';});
  });

  for(var d2=0;d2<5;d2++){
    if(nhd.includes(d2))continue;
    var inOffice=rotatable.filter(function(m){return!isPreJoin(m.id,next,d2)&&ns[m.id][d2]==='off';});

}

function stampVacation(entry,status){
  // A genuine (excused) Mexican holiday is a company-wide day off — it's never bulk-overwritten by
  // the vacation/other-team log, regardless of entry type, so it keeps showing as Holiday rather
  // than being relabeled as someone's personal vacation or blended with an other-team assignment.
  // A mandateApplies (e.g. US) holiday isn't excused for anyone here, so it stays fair game for
  // either entry type, same as before. This applies identically whether we're applying an entry or
  // reverting it (status='off'), so a day left untouched at apply time is also left untouched on
  // removal.
  //
  // An 'otherteam' assignment additionally must never override — or, on removal, clobber — a day
  // that's already vacation/sick. Those represent "not here at all", which outranks "here, but with
  // a different team". A plain vacation/sick re-log is still allowed to overwrite an existing
  // vacation/sick/otherteam day normally.
  var isOtherTeamEntry=entry.type==='otherteam';
  var start=new Date(entry.start+'T12:00:00'),end=new Date(entry.end+'T12:00:00');
  for(var d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    var dow=d.getDay();if(dow===0||dow===6)continue;
    var dayIdx=dow-1;
    var monday=new Date(d);monday.setDate(monday.getDate()-dayIdx);
    var wk=dStr(monday);
    if(!schedule[wk]){schedule[wk]={};MEMBERS.forEach(function(m){schedule[wk][m.id]=Array(5).fill('off');});}
    if(!schedule[wk][entry.id])continue;
    var hol=(holidays[wk]||[]).find(function(h){return h.day===dayIdx;});
    if(hol&&!hol.mandateApplies)continue;
    if(isOtherTeamEntry){
      var cur=schedule[wk][entry.id][dayIdx];
      if(cur==='vacation'||cur==='sick')continue;
    }
    schedule[wk][entry.id][dayIdx]=status;
  }
}

// Whether this member has any recorded schedule/vacation/note history — the gate for allowing a
// hard delete. If true, only "Mark as departed" (leaveDate) is allowed, so past weeks are never lost.
function memberHasHistory(id){
  var hasSchedule=Object.keys(schedule).some(function(wk){var arr=schedule[wk][id];return arr&&arr.some(function(v){return v&&v!=='off';});});
  if(hasSchedule)return true;
  if(vacationLog.some(function(v){return v.id===id;}))return true;

function canHardDelete(id){return!PUBLISHED_MEMBER_IDS.has(id)&&!memberHasHistory(id);}

// just-added mistake — nothing to lose), otherwise soft-removes them as of today, preserving all
// past-week history. Which path runs is decided automatically — the confirm text always makes
// clear which one is happening.
function removeMember(id){
  var m=MEMBERS.find(function(mm){return mm.id===id;});

function monthlyBreakdown(id,mOff){
  var offs=getMonthWeekOffsets(mOff),now2=new Date(),target=new Date(now2.getFullYear(),now2.getMonth()+mOff,1),y=target.getFullYear(),m=target.getMonth();
  var totalWd=0,holDays=0,vacDays=0,sickDays=0,officeDays=0,wfhDays=0;
  offs.forEach(function(o){var dates=wkDates(o),hols=getHols(o),s=getSched(o);
    for(var d=0;d<5;d++){if(dates[d].getFullYear()!==y||dates[d].getMonth()!==m)continue;if(isPreJoin(id,o,d))continue;
      totalWd++;
      var raw=s[id][d],hol=hols.find(function(h){return h.day===d;});
      if(raw==='vacation'){vacDays++;continue;}
      if(raw==='sick'){sickDays++;continue;}
      if(hol&&(raw==='office'||raw==='otherteam')){officeDays++;continue;}
      if(hol&&!hol.mandateApplies){holDays++;if(raw==='wfh')wfhDays++;continue;} // genuine holiday, not physically in any office (off or wfh) -> unavailable
      if(hol&&hol.mandateApplies&&raw==='off')continue; // mandateApplies: still available, but no office credit for not working
      if(raw==='off'||raw==='otherteam')officeDays++;
      else if(raw==='wfh')wfhDays++;
    }
  });
  var available=totalWd-holDays-vacDays-sickDays;
  var expectedOffice=Math.ceil(available*3/5);
  var shortfall=expectedOffice-officeDays;
  var rate=available>0?officeDays/available:1;
  return{totalWd:totalWd,holDays:holDays,vacDays:vacDays,sickDays:sickDays,officeDays:officeDays,wfhDays:wfhDays,available:available,expectedOffice:expectedOffice,shortfall:shortfall,rate:rate};
}

function buildSheetTSV(o){

    rows+='<tr><td style="padding:8px 6px 8px 12px;border-bottom:1px solid #F3F4F6;'+(ri%2===1?'background:#FAFAFA;':'')+'"><div style="display:flex;align-items:center;gap:7px;"><div style="width:28px;height:28px;border-radius:50%;background:'+m.av+';color:'+m.ac+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;">'+m.initials+'</div><div><div style="font-size:12px;font-weight:'+(m.id==='alan'?'600':'400')+';color:#111827;">'+m.first+'</div>'+(noteVal?'<div style="font-size:10px;color:#9CA3AF;margin-top:1px;">'+noteVal+'</div>':'')+'</div></div></td>'+cells+'<td style="padding:6px;text-align:center;border-bottom:1px solid #F3F4F6;'+(ri%2===1?'background:#FAFAFA;':'')+'"><span style="background:'+ocBg+';color:'+ocColor+';font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;">'+oc2+'/'+effM2+'</span></td></tr>';});
    var wkNoteKey='note_week_'+wkKey(o),wkNoteVal=notes[wkNoteKey]||'';
    var legendItems=[['#2563EB','WFH'],['#059669','Shared WFH'],['#7C3AED','Holiday'],['#D97706','Vacation'],['#DC2626','Sick'],['#4F46E5','Other team'],['#F3F4F6','Office']].map(function(x){return'<span style="font-size:11px;color:#6B7280;display:flex;align-items:center;gap:4px;"><i style="width:10px;height:10px;border-radius:2px;background:'+x[0]+';border:'+(x[0]==='#F3F4F6'?'1px solid #E5E7EB':'none')+';display:inline-block;"></i>'+x[1]+'</span>';}).join('');
    document.getElementById('export-section').innerHTML='<div style="margin-top:16px;"><div style="font-size:13px;font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:6px;">'+ico('camera',14)+' Screenshot this card to share</div><div class="export-card"><div class="export-card-header"><div style="font-size:14px;font-weight:600;color:#111827;">'+title+'</div><div style="font-size:11px;color:#9CA3AF;margin-top:2px;">3-day mandate · '+(split?'shift shown per day (10–6 / 11–7)':'single 10–6 shift')+(wkNoteVal?' · '+wkNoteVal:'')+'</div></div><table class="export-table"><thead><tr>'+ths+'</tr></thead><tbody>'+rows+'</tbody></table><div style="display:flex;gap:12px;flex-wrap:wrap;padding:10px 20px;background:#F9FAFB;border-top:1px solid #E5E7EB;">'+legendItems+(split?'<span style="font-size:11px;color:#6B7280;">· <strong>10–6</strong> early · <strong>11–7</strong> late</span>':'')+'</div></div></div>';
  }
}

function renderMonthView(){
  var mOff=monthOffset,now=new Date(),target=new Date(now.getFullYear(),now.getMonth()+mOff,1);
  var wkOffs=getMonthWeekOffsets(mOff),y=target.getFullYear(),m=target.getMonth(),mMems=monthMembers(mOff);
  var fmt=new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short'});
  // Recalculate header for month
  var app=document.getElementById('app');
  var h='<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:1.25rem;"><div><div style="font-size:18px;font-weight:500;">WFH Rotation · Mexico Desk</div><div style="font-size:12px;color:var(--color-text-secondary);margin-top:2px;">Monthly view · 3-day mandate</div></div><div style="display:flex;gap:6px;"><button class="view-btn'+(view==='week'?' active':'')+'" onclick="setView(\'week\')">Weekly</button><button class="view-btn'+(view==='month'?' active':'')+'" onclick="setView(\'month\')">Monthly</button></div></div>';
  h+=statusBannerHTML();
  h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:1rem;"><button class="nav-btn" onclick="navBack()">'+ico('left',14)+'</button><span style="font-size:13px;font-weight:500;min-width:180px;text-align:center;">'+target.toLocaleString('en-GB',{month:'long',year:'numeric'})+'</span><button class="nav-btn" onclick="navFwd()">'+ico('right',14)+'</button></div>';

  var totalAway=0;wkOffs.forEach(function(o){var s=getSched(o),dates=wkDates(o);activeMembers(o).forEach(function(mem){for(var d=0;d<5;d++){if(dates[d].getFullYear()!==y||dates[d].getMonth()!==m||isPreJoin(mem.id,o,d))continue;var st=s[mem.id][d];if(st==='vacation'||st==='sick')totalAway++;}});});
  var ncM=mMems.filter(function(mem){return officeDaysInMonth(mem.id,mOff)<mandateForMonth(mem.id,mOff);}).length;
  h+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem;"><div class="stat"><div class="stat-n">'+wkOffs.length+'</div><div class="stat-l">Weeks</div></div><div class="stat"><div class="stat-n">'+totalAway+'</div><div class="stat-l">Away days</div></div><div class="stat"><div class="stat-n" style="color:'+(ncM>0?'#791F1F':'#27500A')+';">'+(mMems.length-ncM)+'/'+mMems.length+'</div><div class="stat-l">Meeting mandate</div></div><div class="stat"><div class="stat-n">—</div><div class="stat-l"></div></div></div>';

  h+='<div id="month-blocks"></div>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center;"><span class="pill wfh">'+ico('home',11)+' WFH</span><span class="pill holiday">'+ico('flag',11)+' Holiday</span><span class="pill vacation">'+ico('beach',11)+' Vacation</span><span class="pill sick">'+ico('heartoff',11)+' Sick</span><span class="pill otherteam">'+ico('pin',11)+' Other team</span><span class="pill off">'+ico('briefcase',11)+' Office</span></div>';
  app.innerHTML=h;

  var mv=document.getElementById('month-blocks');
  wkOffs.forEach(function(o){
    var dates=wkDates(o),sched2=getSched(o),hols2=getHols(o),holDays2=hols2.map(function(h2){return h2.day;}),wfhPD2=Array(5).fill(0),act2=activeMembers(o),split2=splitActive(o);
    act2.forEach(function(mem){for(var d=0;d<5;d++){if(!isPreJoin(mem.id,o,d)&&sched2[mem.id][d]==='wfh')wfhPD2[d]++;}});
    var locked2=isLocked(o);
    var wb=document.createElement('div');wb.className='wk-block';
    var wh=document.createElement('div');wh.className='wk-header';
    wh.innerHTML='<span>'+fmt.format(dates[0])+' – '+fmt.format(dates[4])+(locked2?' <span class="lock-badge">'+ico('lock',9)+'</span>':'')+'</span><button style="font-size:11px;padding:2px 8px;border-radius:20px;border:0.5px solid var(--color-border-secondary);background:none;cursor:pointer;color:var(--color-text-secondary);white-space:nowrap;" onclick="wkOffset='+o+';setView(\'week\')">Edit '+ico('right',11)+'</button>';
    wb.appendChild(wh);
    var inner=document.createElement('div');inner.style.cssText='padding:6px 12px;';
    var hr2=document.createElement('div');hr2.style.cssText='display:flex;align-items:center;gap:6px;padding-bottom:4px;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:4px;';hr2.innerHTML='<div style="width:26px;flex-shrink:0;"></div><div style="width:100px;flex-shrink:0;"></div>';
    var dg2=document.createElement('div');dg2.className='dcells';dg2.style.flex='1';
    DAYS.forEach(function(day,i){var hol=hols2.find(function(h2){return h2.day===i;}),inM=dates[i].getFullYear()===y&&dates[i].getMonth()===m;var div=document.createElement('div');div.className='col-head';div.style.opacity=inM?'1':'0.3';div.innerHTML='<span style="color:'+(hol?'#A78BFA':'var(--color-text-secondary)')+';">'+day+'</span><br><span style="color:var(--color-text-tertiary);">'+dates[i].getDate()+'</span>';dg2.appendChild(div);});
    hr2.appendChild(dg2);hr2.innerHTML+='<div style="width:44px;flex-shrink:0;text-align:center;font-size:10px;color:var(--color-text-secondary);">Office</div>';inner.appendChild(hr2);
    act2.forEach(function(mem){
      var mr=document.createElement('div');mr.style.cssText='display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:0.5px solid var(--color-border-tertiary);';
      var av2=document.createElement('div');av2.className='avatar';av2.style.cssText='width:26px;height:26px;font-size:9px;background:'+mem.av+';color:'+mem.ac+';';av2.textContent=mem.initials;mr.appendChild(av2);
      var nw=document.createElement('div');nw.style.cssText='width:100px;flex-shrink:0;display:flex;align-items:center;gap:4px;';var dsh2=memberDisplayShift(o,mem.id);nw.innerHTML='<span style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+mem.first+'</span><span class="shift-badge '+dsh2+'">'+(dsh2==='mixed'?'Mix':shiftShortLabel(dsh2))+'</span>';mr.appendChild(nw);
      var cg=document.createElement('div');cg.className='dcells';var wkOff2=0;
      for(var d=0;d<5;d++){var inM=dates[d].getFullYear()===y&&dates[d].getMonth()===m,isHol=holDays2.includes(d),pre=isPreJoin(mem.id,o,d);var raw=sched2[mem.id][d];var c=document.createElement('div');if(pre){c.className='monthly-cell prejoin';c.style.opacity=inM?'.4':'.15';c.textContent='–';cg.appendChild(c);continue;}var st=(isHol&&raw==='off')?'holiday':raw;if(st==='wfh'&&wfhPD2[d]>1)st='shared';c.className='monthly-cell '+st;c.style.opacity=inM?'1':'0.25';if(split2&&isWorking(raw)&&st!=='holiday'){var sh=effShift(o,mem.id,d);c.style.boxShadow='inset 0 -3px 0 '+(SHIFTS[sh]?SHIFTS[sh].bd:'#0E7490');}c.innerHTML=cellIcon(st);cg.appendChild(c);if(inM){if(isHol){if(raw==='office')wkOff2++;}else if(raw==='off')wkOff2++;}}
      mr.appendChild(cg);var oc2=document.createElement('div');oc2.style.cssText='width:44px;flex-shrink:0;text-align:center;';oc2.innerHTML='<span class="'+complyClass(wkOff2,MANDATE)+'" style="font-size:11px;">'+wkOff2+'</span><span style="font-size:10px;color:var(--color-text-tertiary);">/'+MANDATE+'</span>';mr.appendChild(oc2);inner.appendChild(mr);
    });
    wb.appendChild(inner);mv.appendChild(wb);
  });
}

// Some browsers restore a tab from bfcache (back/forward cache) instead of truly re-running this
// script from scratch — that resumes the exact in-memory state from before, including whatever week
// you'd navigated to, rather than landing back on the current week. Force it back to "today" so a
// reload/tab-restore always opens on the current week, matching a genuine fresh load.
window.addEventListener('pageshow',function(e){
  if(e.persisted){wkOffset=0;monthOffset=0;dismissedAlerts.clear();showExport=false;showCopy=false;showTeams=false;render();}
});

bootAndRender();
</script>
